# Handoff Hub — workspace-local handoff synchronization for sibling model sessions.
# The room directory is resolved relative to each calling session's working directory
# unless an absolute path is supplied. All tools are Host-only.
- insert:
    - id: handoff-hub
      name: 'dsh-handoff-hub'
      config:
        directory: 'work/handoff'
        promptLanguage: 'zh'
        nudgeDelaySeconds: 1
        maxRecipients: 16
        maxDocBytes: 262144
        # Opt-in: deleting ended tasks makes the Schedule service inject a
        # no-op "[SCHEDULE CHANGE]" notice into every involved live session.
        cleanupEndedTasks: false
        # Local workspace: directory-change auto reminder is ON with a 30s
        # debounce and a 5s poll. Set enabled: false to switch it off.
        autoRemind:
          enabled: true
          debounceSeconds: 30
          pollSeconds: 5
          mergeSeconds: 60
        autoNudgeCooldownMinutes: 10
        autoNudgeDailyCap: 24
        autoNudgeSilenceAfter: 2
