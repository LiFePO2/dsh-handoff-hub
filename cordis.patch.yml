# Handoff Hub — shared handoff-document sync for sibling DSH sessions.
# `directory` is resolved against each calling session's working directory unless
# an absolute path is supplied. All tools are Host-only.
- insert:
    - id: handoff-hub
      name: 'dsh-handoff-hub'
      config:
        directory: 'work/handoff'
        promptLanguage: 'zh'
        nudgeDelaySeconds: 1
        maxRecipients: 16
        maxDocBytes: 262144
        # Opt-in: deleting ended tasks makes the Schedule service inject a
        # no-op "[SCHEDULE CHANGE]" notice into every involved live session.
        cleanupEndedTasks: false
        # Directory-change auto reminder. Public default: off (set enabled: true
        # to opt in). Reminders are targeted: the changed document's author is
        # skipped, and only peers whose own handoff document is stale are nudged.
        autoRemind:
          enabled: false
          debounceSeconds: 30
          pollSeconds: 10
          mergeSeconds: 60
